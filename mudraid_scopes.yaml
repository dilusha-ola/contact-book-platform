version: 1
platform_id: 9bc92a6c-e231-477b-b509-f276c21af2ba
scopes:
  - name: companies:read
    group: companies
    description: "Read-only access to company contact data"
  - name: companies:write
    group: companies
    description: "Create, update, and delete access for company contact data"
  - name: contacts:write
    group: contacts
    description: "Create, update, and delete access for personal contact data"
  - name: contacts:read
    group: contacts
    description: "Read access for personal contact data"
routes:
  # Public & static endpoints
  - method: GET
    path: /
    public: true
  - method: GET
    path: /index.html
    public: true
  - method: GET
    path: /health
    public: true
  - method: GET
    path: /css/*
    public: true
  - method: GET
    path: /js/*
    public: true
  - method: GET
    path: /api/v1
    public: true
  - method: POST
    path: /api/v1
    public: true
  - method: GET
    path: /api/v1/health
    public: true
  - method: POST
    path: /api/v1/webhooks/mudraid
    public: true
  - method: POST
    path: /api/v1/webhooks/delivery-destination
    public: true


  - method: GET
    path: /api/v1/contacts
    scope: contacts:read
  - method: GET
    path: /api/v1/contacts/stats
    scope: contacts:read
  - method: GET
    path: /api/v1/contacts/{contact_id}
    scope: contacts:read
  - method: POST
    path: /api/v1/contacts
    scope: contacts:write
  - method: PUT
    path: /api/v1/contacts/{contact_id}
    scope: contacts:write
  - method: DELETE
    path: /api/v1/contacts/{contact_id}
    scope: contacts:write

  - method: GET
    path: /api/v1/companies
    scope: companies:read
  - method: GET
    path: /api/v1/companies/stats
    scope: companies:read
  - method: GET
    path: /api/v1/companies/{company_id}
    scope: companies:read
  - method: POST
    path: /api/v1/companies
    scope: companies:write
  - method: PUT
    path: /api/v1/companies/{company_id}
    scope: companies:write
  - method: DELETE
    path: /api/v1/companies/{company_id}
    scope: companies:write
