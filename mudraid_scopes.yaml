platform_id: 4f8e9c1d-2b4f-5e6a-7b8c-9d0e1f2a3b4c
version: 1
routes:
  # Public & static endpoints
  - method: GET
    path: /
    public: true
  - method: GET
    path: /index.html
    public: true
  - method: GET
    path: /health
    public: true

  # Personal Contacts endpoints
  - method: GET
    path: /api/v1/contacts
    scope: contacts:read
  - method: GET
    path: /api/v1/contacts/stats
    scope: contacts:read
  - method: GET
    path: /api/v1/contacts/{contact_id}
    scope: contacts:read
  - method: POST
    path: /api/v1/contacts
    scope: contacts:write
  - method: PUT
    path: /api/v1/contacts/{contact_id}
    scope: contacts:write
  - method: DELETE
    path: /api/v1/contacts/{contact_id}
    scope: contacts:write

  # Company Contacts endpoints
  - method: GET
    path: /api/v1/companies
    scope: companies:read
  - method: GET
    path: /api/v1/companies/stats
    scope: companies:read
  - method: GET
    path: /api/v1/companies/{company_id}
    scope: companies:read
  - method: POST
    path: /api/v1/companies
    scope: companies:write
  - method: PUT
    path: /api/v1/companies/{company_id}
    scope: companies:write
  - method: DELETE
    path: /api/v1/companies/{company_id}
    scope: companies:write
